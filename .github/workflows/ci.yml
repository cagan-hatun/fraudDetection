name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest runner'larında Docker önceden kurulu geliyor, bu
      # yüzden Testcontainers testleri (gerçek Postgres+Kafka) de dahil
      # TÜM suite'i çalıştırabiliyoruz — sadece unit testlere indirgemedik.
      - name: Run tests (unit + Testcontainers integration)
        working-directory: backend
        run: ./mvnw test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # openapi-typescript henüz TypeScript 6'yı peer dep olarak tanımıyor
      # (bkz. frontend/README.md) — --legacy-peer-deps burada da gerekli.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
