spring.application.name=project
spring.mvc.problemdetails.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5433/fraud_db
spring.datasource.username=fraud_user
spring.datasource.password=fraud_pass

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

ml-service.base-url=http://127.0.0.1:8000

# Frontend dev server (Vite). Prod'da gercek domain'e degistirilir.
cors.allowed-origins=http://localhost:5173

# Portfolyo/demo projesi icin application.properties'te duruyor - gercek bir
# production ortaminda bu bir secret manager'da (env var, Vault, vb.) tutulur.
jwt.secret=Pp0tZgehZ5jheesb_N_VF6N9GkW4yItfZGPFqmAelUQ4cYRHMd1k-3qA_-kz84NX
jwt.expiration-ms=3600000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=fraud-backend
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.fraud.project.kafka

kafka.topic.transactions=transactions

# Sadece health+info dışa açılıyor — Actuator'ın diğer uç noktaları (env,
# beans, threaddump vb.) iç bilgi sızdırabileceği için varsayılan olarak
# KAPALI tutuluyor, "her şeyi aç" kolaylığı tercih edilmedi.
management.endpoints.web.exposure.include=health,info
# Demo/portfolyo projesi olduğu için DB/diskSpace gibi bileşen durumlarını
# göstermek bir sakınca değil, aksine "servis gerçekten neye bağlı" sorusunu
# görünür kılıyor.
management.endpoint.health.show-details=always
