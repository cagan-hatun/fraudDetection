services:
  postgres:
    image: postgres:16
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    ports:
      # Host tarafında 5433: bu makinede 5432'yi zaten native bir
      # PostgreSQL servisi (Windows service) kullanıyor.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # backend'in Flyway migration'ları DB gerçekten bağlantı kabul etmeden
      # başlarsa başarısız olur — depends_on'un "condition: service_healthy"
      # koşulu bunu bekliyor.
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      # Tek node'luk dev broker, KRaft modunda (Zookeeper yok).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # İKİ ayrı listener: PLAINTEXT host'tan (localhost:9092, örn. backend'i
      # docker-compose DIŞINDA `mvnw spring-boot:run` ile çalıştırırken),
      # PLAINTEXT_INTERNAL container ağından (backend servisi bu compose
      # içindeyken `kafka:29092` olarak) erişim için — ikisi birbirinin
      # yerine geçemez çünkü "advertised listener" dışarıdan çözülebilir bir
      # adres olmalı, container'lar "localhost"u kendi host'una göre çözer.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: fraud-detection-dev-cluster

  ml-service:
    build: ../ml-service
    container_name: fraud-ml-service
    ports:
      - "8000:8000"

  backend:
    build: ../backend
    container_name: fraud-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      ml-service:
        condition: service_started
    environment:
      # application.properties'teki host-modu varsayılanlarının (localhost:5433,
      # localhost:9092, 127.0.0.1:8000) hepsini container ağı adresleriyle
      # override ediyoruz — kod değişmiyor, sadece Spring'in relaxed binding'i
      # üzerinden env var'lar properties'in önüne geçiyor.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_SERVICE_BASE_URL: http://ml-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173

  frontend:
    build:
      context: ../frontend
      args:
        # Tarayıcıda çalışacak kod backend'e container ağı üzerinden değil,
        # kullanıcının kendi makinesinden (host'a açılan porttan) erişir —
        # bu yüzden burada da "backend" değil "localhost" doğru adres.
        VITE_API_BASE_URL: http://localhost:8080
    container_name: fraud-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
